[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabglyphdiag"
version = "0.1.0"
description = "Arabic-script-specific structural error diagnostics for handwritten character recognition"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Asmae Briouya"}
]
keywords = [
  "arabic", "handwriting", "ocr", "diagnostics", "classification", "error-analysis"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2"
]

[project.optional-dependencies]
keras = ["tensorflow>=2.16"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
arabglyphdiag = "arab_glyph_diag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
